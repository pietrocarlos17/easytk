<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women — Accessories | ADDS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; color: #000; background: #fff; -webkit-font-smoothing: antialiased; }
    .promo-bar { background: #000; color: #fff; text-align: center; font-size: 11px; font-weight: 700; padding: 8px 16px; letter-spacing: 1px; text-transform: uppercase; }
    .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 7px 16px; border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; background: #fff; z-index: 100; }
    .nav-logo { display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .nav-icons { display: flex; gap: 14px; align-items: center; justify-content: flex-end; }
    .nav button { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; }
    .nav svg { width: 22px; height: 22px; fill: none; stroke: #000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .page-header { padding: 20px 16px 12px; }
    .page-eyebrow { font-size: 11px; color: #767677; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
    .page-title { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.3px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 24px; text-align: center; gap: 12px; }
    .empty-state svg { opacity: 0.1; }
    .empty-state h2 { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .empty-state p { font-size: 13px; color: #767677; line-height: 1.5; }
    footer { padding: 28px 16px 20px; border-top: 1px solid #e8e8e8; margin-top: 32px; }
    .footer-copy { font-size: 11px; color: #767677; line-height: 1.6; }
    .cart-badge { display: none; position: absolute; top: -5px; right: -7px; width: 16px; height: 16px; border-radius: 50%; background: #000; color: #fff; font-size: 9px; font-weight: 700; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="promo-bar">Free UK Delivery for New Collections</div>

<nav class="nav">
  <button onclick="history.back()" aria-label="Back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <a class="nav-logo" href="home.html" aria-label="ADDS">
    <img src="logo.jpg" alt="ADDS" style="height:36px;width:auto;display:block;" />
  </a>
  <div class="nav-icons">
    <button onclick="CartDrawer.open()" aria-label="Bag" style="position:relative;display:flex;align-items:center;background:none;border:none;cursor:pointer;padding:0;">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
      <span class="cart-badge">0</span>
    </button>
  </div>
</nav>

<div class="page-header">
  <p class="page-eyebrow">Women</p>
  <h1 class="page-title">Accessories</h1>
</div>

<div class="empty-state">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.2"><path d="M2 18l4-8 4 4 4-6 4 10H2z"/></svg>
  <h2>Coming Soon</h2>
  <p>New styles dropping soon.<br>Check back shortly.</p>
</div>

<footer>
  <p class="footer-copy">© 2025 Adidas</p>
</footer>

<script src="cart.js"></script>
<script src="cookie-consent.js"></script>
<script src="footer.js"></script>
</body>
</html>
