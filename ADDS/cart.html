<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bag | ADDS Sport</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; color: #000; background: #fff; -webkit-font-smoothing: antialiased; }

    .promo-bar { background: #000; color: #fff; text-align: center; font-size: 11px; font-weight: 700; padding: 8px 16px; letter-spacing: 1px; text-transform: uppercase; }

    .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 7px 16px; border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; background: #fff; z-index: 100; }
    .nav-logo { display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .nav-icons { display: flex; gap: 14px; align-items: center; justify-content: flex-end; }
    .nav button, .nav-hamburger { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; }
    .nav svg { width: 22px; height: 22px; fill: none; stroke: #000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    /* PAGE */
    .page-header { padding: 20px 16px 16px; border-bottom: 1px solid #e8e8e8; }
    .page-title { font-size: 20px; font-weight: 900; text-transform: uppercase; }
    .page-count { font-size: 12px; color: #767677; margin-top: 3px; }

    /* EMPTY */
    .cart-empty { display: none; padding: 48px 16px; text-align: center; }
    .cart-empty h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; }
    .cart-empty p { font-size: 13px; color: #767677; margin-bottom: 24px; }
    .cart-empty a { display: inline-block; background: #000; color: #fff; padding: 14px 28px; font-size: 13px; font-weight: 700; text-transform: uppercase; text-decoration: none; letter-spacing: 0.5px; }

    /* ITEMS */
    .cart-items { padding: 0 16px; }
    .cart-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid #e8e8e8; }
    .cart-item-img { flex: 0 0 90px; width: 90px; aspect-ratio: 3/4; background: #f0f0f0; overflow: hidden; }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cart-item-img .img-ph { width: 100%; height: 100%; }
    .cart-item-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .cart-item-name { font-size: 12px; font-weight: 700; text-transform: uppercase; line-height: 1.3; }
    .cart-item-meta { font-size: 12px; color: #767677; }
    .cart-item-price { font-size: 13px; font-weight: 700; margin-top: auto; }
    .cart-item-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .qty-control { display: flex; align-items: center; gap: 0; border: 1px solid #e8e8e8; }
    .qty-btn { width: 32px; height: 32px; background: none; border: none; cursor: pointer; font-size: 16px; font-weight: 300; display: flex; align-items: center; justify-content: center; }
    .qty-num { width: 28px; text-align: center; font-size: 13px; font-weight: 600; }
    .remove-btn { font-size: 11px; color: #767677; text-decoration: underline; background: none; border: none; cursor: pointer; font-family: inherit; text-underline-offset: 2px; }

    /* SUMMARY */
    .cart-summary { margin: 0 16px; padding: 20px 0; border-top: 1px solid #e8e8e8; }
    .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
    .summary-row.total { font-weight: 700; font-size: 15px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #e8e8e8; }
    .summary-delivery { font-size: 12px; color: #2a7a4b; font-weight: 600; }

    /* CHECKOUT BTN */
    .checkout-wrap { padding: 0 16px 32px; }
    .btn-checkout { display: block; width: 100%; padding: 16px; background: #000; color: #fff; border: none; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; font-family: inherit; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-continue { display: block; text-align: center; font-size: 12px; color: #767677; text-decoration: underline; margin-top: 12px; text-underline-offset: 2px; }
  </style>
</head>
<body>

<div class="promo-bar">Free UK Delivery for New Collections</div>

<nav class="nav">
  <button class="nav-hamburger" aria-label="Menu">
    <svg viewBox="0 0 24 24"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
  </button>
  <a class="nav-logo" href="home.html" aria-label="ADDS">
    <img src="logo.jpg" alt="ADDS" style="height:36px;width:auto;display:block;" />
  </a>
  <div class="nav-icons">
    <button aria-label="Search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
    </button>
    <a href="cart.html" aria-label="Bag" style="position:relative;display:flex;align-items:center;text-decoration:none;color:inherit;">
      <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:#000;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
      <span class="cart-badge" style="display:none;position:absolute;top:-5px;right:-7px;width:16px;height:16px;border-radius:50%;background:#000;color:#fff;font-size:9px;font-weight:700;align-items:center;justify-content:center;">0</span>
    </a>
  </div>
</nav>

<div class="page-header">
  <h1 class="page-title">Your Bag</h1>
  <p class="page-count" id="page-count"></p>
</div>

<!-- EMPTY STATE -->
<div class="cart-empty" id="cart-empty">
  <h2>Your bag is empty</h2>
  <p>Looks like you haven't added anything yet.</p>
  <a href="collection.html">Shop New Arrivals</a>
</div>

<!-- ITEMS -->
<div class="cart-items" id="cart-items"></div>

<!-- SUMMARY -->
<div class="cart-summary" id="cart-summary" style="display:none;">
  <div class="summary-row">
    <span>Subtotal</span>
    <span id="summary-subtotal">£0.00</span>
  </div>
  <div class="summary-row">
    <span>Delivery</span>
    <span class="summary-delivery">Free</span>
  </div>
  <div class="summary-row total">
    <span>Total</span>
    <span id="summary-total">£0.00</span>
  </div>
</div>

<!-- CHECKOUT -->
<div class="checkout-wrap" id="checkout-wrap" style="display:none;">
  <!-- Substituir o href pelo link de checkout real (Stripe, Shopify, etc.) -->
  <a class="btn-checkout" href="#" id="btn-checkout">Proceed to Checkout →</a>
  <a class="btn-continue" href="collection.html">Continue Shopping</a>
</div>

<script src="cart.js"></script>
<script>
  function fmt(n) { return '£' + n.toFixed(2); }

  function renderCart() {
    const items = Cart.get();
    const itemsEl = document.getElementById('cart-items');
    const emptyEl = document.getElementById('cart-empty');
    const summaryEl = document.getElementById('cart-summary');
    const checkoutEl = document.getElementById('checkout-wrap');
    const countEl = document.getElementById('page-count');

    const total = items.reduce(function(s, i) { return s + i.qty; }, 0);
    countEl.textContent = total + (total === 1 ? ' item' : ' items');

    if (items.length === 0) {
      emptyEl.style.display = 'block';
      summaryEl.style.display = 'none';
      checkoutEl.style.display = 'none';
      itemsEl.innerHTML = '';
      return;
    }

    emptyEl.style.display = 'none';
    summaryEl.style.display = 'block';
    checkoutEl.style.display = 'block';

    itemsEl.innerHTML = items.map(function(item) {
      var bg = item.colour === 'White' ? '#d8d8d8' : item.colour === 'Red' ? '#c0392b' : item.colour === 'Navy' ? '#1a2d5a' : '#111';
      return '<div class="cart-item" data-id="' + item.id + '">' +
        '<div class="cart-item-img"><div class="img-ph" style="background:' + bg + ';"></div></div>' +
        '<div class="cart-item-info">' +
          '<p class="cart-item-name">' + item.name + '</p>' +
          '<p class="cart-item-meta">' + item.colour + ' · Size ' + item.size + '</p>' +
          '<div class="cart-item-actions">' +
            '<div class="qty-control">' +
              '<button class="qty-btn" onclick="changeQty(\'' + item.id + '\',-1)">−</button>' +
              '<span class="qty-num">' + item.qty + '</span>' +
              '<button class="qty-btn" onclick="changeQty(\'' + item.id + '\',1)">+</button>' +
            '</div>' +
            '<button class="remove-btn" onclick="removeItem(\'' + item.id + '\')">Remove</button>' +
          '</div>' +
          '<p class="cart-item-price">' + fmt(item.price * item.qty) + '</p>' +
        '</div>' +
      '</div>';
    }).join('');

    var sub = Cart.subtotal();
    document.getElementById('summary-subtotal').textContent = fmt(sub);
    document.getElementById('summary-total').textContent = fmt(sub);
  }

  function changeQty(id, delta) {
    var items = Cart.get();
    var item = items.find(function(i) { return i.id === id; });
    if (item) Cart.setQty(id, item.qty + delta);
    renderCart();
  }

  function removeItem(id) {
    Cart.remove(id);
    renderCart();
  }

  renderCart();
</script>
<script src="cookie-consent.js"></script>
<script src="footer.js"></script>
</body>
</html>
