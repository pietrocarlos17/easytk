<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Women — Shoes | ADDS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; color: #000; background: #fff; -webkit-font-smoothing: antialiased; }
    .promo-bar { background: #000; color: #fff; text-align: center; font-size: 11px; font-weight: 700; padding: 8px 16px; letter-spacing: 1px; text-transform: uppercase; }
    .nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 7px 16px; border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; background: #fff; z-index: 100; }
    .nav-logo { display: flex; align-items: center; justify-content: center; text-decoration: none; }
    .nav-icons { display: flex; gap: 14px; align-items: center; justify-content: flex-end; }
    .nav button { background: none; border: none; cursor: pointer; padding: 0; display: flex; align-items: center; }
    .nav svg { width: 22px; height: 22px; fill: none; stroke: #000; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

    .page-header { padding: 20px 16px 12px; }
    .page-eyebrow { font-size: 11px; color: #767677; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }
    .page-title { font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.3px; }
    .page-count { font-size: 12px; color: #767677; margin-top: 3px; }

    /* ── PRODUCT GRID ── */
    .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
    .product-card { background: #fff; text-decoration: none; color: #000; display: block; }
    .product-card-img {
      width: 100%; aspect-ratio: 3/4; background: #f0f0f0;
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .product-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .product-badge { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; background: #000; color: #fff; padding: 3px 7px; letter-spacing: 0.5px; z-index: 2; }

    /* arrows */
    .card-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; background: rgba(255,255,255,0.85);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 3; opacity: 0; transition: opacity .15s;
    }
    .product-card-img:hover .card-arrow { opacity: 1; }
    .card-arrow-prev { left: 4px; }
    .card-arrow-next { right: 4px; }
    .card-arrow svg { width: 14px; height: 14px; stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

    /* counter */
    .img-counter {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,0.45); color: #fff;
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      letter-spacing: 0.3px; z-index: 2;
    }

    /* swatches */
    .pc-swatches { display: flex; gap: 5px; padding: 7px 4px 0; }
    .pc-swatch {
      width: 22px; height: 22px; border-radius: 0;
      border: 1.5px solid transparent; cursor: pointer;
      overflow: hidden; flex-shrink: 0;
      background-size: cover; background-position: center;
    }
    .pc-swatch.active { border-color: #000; }

    .product-card-info { padding: 6px 4px 10px; }
    .product-card-name { font-size: 11px; font-weight: 700; text-transform: uppercase; line-height: 1.3; margin-bottom: 4px; }
    .product-card-price { font-size: 13px; font-weight: 700; }

    footer { padding: 28px 16px 20px; border-top: 1px solid #e8e8e8; margin-top: 32px; }
    .footer-copy { font-size: 11px; color: #767677; line-height: 1.6; }
    .cart-badge { display: none; position: absolute; top: -5px; right: -7px; width: 16px; height: 16px; border-radius: 50%; background: #000; color: #fff; font-size: 9px; font-weight: 700; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="promo-bar">Free UK Delivery for New Collections</div>

<nav class="nav">
  <button onclick="history.back()" aria-label="Back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <a class="nav-logo" href="home.html" aria-label="ADDS">
    <img src="logo.jpg" alt="ADDS" style="height:36px;width:auto;display:block;" />
  </a>
  <div class="nav-icons">
    <button onclick="CartDrawer.open()" aria-label="Bag" style="position:relative;display:flex;align-items:center;background:none;border:none;cursor:pointer;padding:0;">
      <svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg>
      <span class="cart-badge">0</span>
    </button>
  </div>
</nav>

<div class="page-header">
  <p class="page-eyebrow">Women</p>
  <h1 class="page-title">Shoes</h1>
  <p class="page-count">1 product</p>
</div>

<div class="product-grid">

  <a class="product-card" href="hyperboost-edge-running-shoes.html" data-img-idx="0">
    <div class="product-card-img">
      <img src="images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_01_00_standard.avif" alt="HyperBoost Edge Running Shoes">
      <span class="product-badge">New</span>

      <button class="card-arrow card-arrow-prev" onclick="navigateCard(event,this,-1)" aria-label="Previous photo">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="card-arrow card-arrow-next" onclick="navigateCard(event,this,1)" aria-label="Next photo">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <span class="img-counter">1/9</span>
    </div>

    <div class="pc-swatches">
      <div class="pc-swatch active" title="Core Black / Carbon / Carbon"
        style="background-image:url('images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_01_00_standard.avif')"
        data-imgs='["images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_01_00_standard.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_02_standard_hover.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_03_standard.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_04_standard.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_05_standard.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_06_standard.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_09_standard.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_41_detail.avif","images/hyperboost-edge/core-black/HYPERBOOST_EDGE_Running_Shoes_Black_KI0357_42_detail.avif"]'
        onclick="selectCardColour(event,this)"></div>
      <div class="pc-swatch" title="Cloud White / Silver Metallic / Zero Metalic"
        style="background-image:url('images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM1.avif')"
        data-imgs='["images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM1.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM3_hover.tiff.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM4_hover.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM5.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM6.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM8.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM9.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM10.avif","images/hyperboost-edge/cloud-white/HYPERBOOST_EDGE_Running_Shoes_White_KI4426_HM11.avif"]'
        onclick="selectCardColour(event,this)"></div>
      <div class="pc-swatch" title="Cloud White / Clear Pink"
        style="background-image:url('images/hyperboost-edge/cloud-white-pink/HYPERBOOST_EDGE_Pink_01_side.webp')"
        data-imgs='["images/hyperboost-edge/cloud-white-pink/HYPERBOOST_EDGE_Pink_01_side.webp","images/hyperboost-edge/cloud-white-pink/HYPERBOOST_EDGE_Pink_02_top.webp","images/hyperboost-edge/cloud-white-pink/HYPERBOOST_EDGE_Pink_03_sole.webp","images/hyperboost-edge/cloud-white-pink/HYPERBOOST_EDGE_Pink_04_front.webp","images/hyperboost-edge/cloud-white-pink/HYPERBOOST_EDGE_Pink_05_back.webp","images/hyperboost-edge/cloud-white-pink/HYPERBOOST_EDGE_Pink_06_side2.webp"]'
        onclick="selectCardColour(event,this)"></div>
    </div>

    <div class="product-card-info">
      <p class="product-card-name">HyperBoost Edge Running Shoes</p>
      <p class="product-card-price">£119.00</p>
    </div>
  </a>

</div>

<footer>
  <p class="footer-copy">© 2025 Adidas. All rights reserved.</p>
</footer>

<script src="cart.js"></script>
<script>
  document.querySelectorAll('.product-card').forEach(card => {
    const active = card.querySelector('.pc-swatch.active');
    if (!active) return;
    const imgs = JSON.parse(active.dataset.imgs);
    const counter = card.querySelector('.img-counter');
    if (counter) counter.textContent = '1/' + imgs.length;
  });

  function updateCardImage(card, imgs, idx) {
    card.querySelector('.product-card-img img').src = imgs[idx];
    card.dataset.imgIdx = idx;
    const counter = card.querySelector('.img-counter');
    if (counter) counter.textContent = (idx + 1) + '/' + imgs.length;
  }

  function navigateCard(e, btn, dir) {
    e.preventDefault(); e.stopPropagation();
    const card = btn.closest('.product-card');
    const activeSwatch = card.querySelector('.pc-swatch.active');
    const imgs = JSON.parse(activeSwatch.dataset.imgs);
    const idx = parseInt(card.dataset.imgIdx || '0');
    updateCardImage(card, imgs, (idx + dir + imgs.length) % imgs.length);
  }

  function selectCardColour(e, btn) {
    e.preventDefault(); e.stopPropagation();
    const card = btn.closest('.product-card');
    card.querySelectorAll('.pc-swatch').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    const imgs = JSON.parse(btn.dataset.imgs);
    updateCardImage(card, imgs, 0);
  }
</script>
<script src="cookie-consent.js"></script>
<script src="footer.js"></script>
</body>
</html>
